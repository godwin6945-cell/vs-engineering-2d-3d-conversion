[project]
name = "sketch2step-enterprise"
version = "0.1.0"
description = "Multi-tenant B2B SaaS for 2D engineering drawing to parametric 3D STEP conversion"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sketch2STEP Core Team", email = "engineering@sketch2step.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "redis>=5.1.0",
    "arq>=0.26.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "boto3>=1.35.0",
    "types-boto3>=1.35.0",
    "cryptography>=43.0.1",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/spec", "packages/cad", "apps/api", "apps/worker"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
pythonpath = [
    ".",
    "packages/spec",
    "packages/cad",
    "apps/api"
]
testpaths = [
    "apps/api/tests",
    "packages/cad/tests",
    "packages/spec/tests"
]
python_files = "test_*.py"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
